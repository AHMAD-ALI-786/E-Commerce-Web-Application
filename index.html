<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Home Page | AHMAD ALI</title>

  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="Home.css" />
</head>

<body>
  <!-- Header -->
  <header class="header">

    <!-- Header - Logo -->
    <div class="header-logo">
      AHMAD <span class="header-logo-text-2">ALI</span>
    </div>

    <!-- Header - Admin Page Link -->
    <a href="Admin.html">
      <svg class="cart-box-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
        <path
          d="M224 248a120 120 0 1 1 0-240 120 120 0 1 1 0 240zm-30.5 56l61 0c9.7 0 17.5 7.8 17.5 17.5 0 4.2-1.5 8.2-4.2 11.4l-27.4 32 31 115.1 .6 0 34.6-138.5c2.2-8.7 11.1-14 19.5-10.8 61.9 23.6 105.9 83.6 105.9 153.8 0 15.1-12.3 27.4-27.4 27.4L43.4 512c-15.1 0-27.4-12.3-27.4-27.4 0-70.2 44-130.2 105.9-153.8 8.4-3.2 17.3 2.1 19.5 10.8l34.6 138.5 .6 0 31-115.1-27.4-32c-2.7-3.2-4.2-7.2-4.2-11.4 0-9.7 7.8-17.5 17.5-17.5z" />
      </svg>
    </a>

    <!-- Header - Cart Box - Cart icon and Cart Count -->
    <div class="cart-box">
      <a href="cart.html">
        <svg class="cart-box-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512">
          <path
            d="M331.8 440.4a45.8 45.8 0 1 1 91.5 .3 45.8 45.8 0 1 1 -91.5-.3zM169.4 394.9a45.7 45.7 0 1 0 .3 91.3 45.7 45.7 0 1 0 -.3-91.3zm291.7-270c-302.2 0-379.2-12.8-461.1-99.2 34.4 51.7 53.3 148.9 373.1 144.2 333.3-5 130 86.1 70.8 188.9 186.7-166.7 319.4-233.9 17.2-233.9z" />
        </svg>
      </a>
      <span class="cart-box-count"></span>
    </div>

  </header>

  <!-- Main -->
  <main>

    <!-- Main - Toss Notification -->
    <div id="toast" class="toast" role="status" aria-live="polite">
      <!-- text Content add at run time -->
    </div>

    <!-- Main - Search bar -->
    <div class="product-form-field">
      <input class="product-form-input" id="search_bar" placeholder="Search kra by product name or category name...."
        type="search" />
    </div>

    <!-- Main - Section - Product Section Grid -->
    <section class="products-section">
      <h2 class="section-title">Featured Products</h2>

      <ul class="product-grid">
        <!-- Add product list's at run time -->
      </ul>

    </section>

  </main>

  <script src="../Online_Store/Home.js"></script>
</body>

</html>
